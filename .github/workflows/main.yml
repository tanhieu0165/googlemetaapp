name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Tao moi hoan toan thu muc Android
      run: |
        rm -rf android
        flutter create . --platforms=android --org click.demo24h
        python3 -c "
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r', encoding='utf-8') as f:
            s = f.read()
        perm = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
        if 'android.permission.INTERNET' not in s:
            s = s.replace('<application', perm + '    <application')
        if 'android:usesCleartextTraffic' not in s:
            s = s.replace('<application', '<application\n        android:usesCleartextTraffic=\"true\"')
        with open(path, 'w', encoding='utf-8') as f:
            f.write(s)
        "

    - name: Cai dat cac thu vien
      run: flutter pub get

    - name: Tao icon va Splash Screen
      run: |
        dart run flutter_launcher_icons || true
        dart run flutter_native_splash:create || true

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload file APK hoan chinh
      uses: actions/upload-artifact@v4
      with:
        name: googlemeta-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
