name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Tao moi khung Android va Nang cap Kotlin
      run: |
        rm -rf android
        flutter create . --platforms=android --org click.demo24h
        python3 -c "
        import os, re
        
        # 1. Nang cap Kotlin len 1.9.24 trong settings.gradle
        for fpath in ['android/settings.gradle', 'android/settings.gradle.kts']:
            if os.path.exists(fpath):
                with open(fpath, 'r', encoding='utf-8') as f:
                    content = f.read()
                content = re.sub(r'(\"org\.jetbrains\.kotlin\.android\"\s+version\s+)\"[^\"]+\"', r'\g<1>\"1.9.24\"', content)
                content = re.sub(r'(\(\"org\.jetbrains\.kotlin\.android\"\)\s+version\s+)\"[^\"]+\"', r'\g<1>\"1.9.24\"', content)
                with open(fpath, 'w', encoding='utf-8') as f:
                    f.write(content)
        
        # 2. Nang cap ext.kotlin_version trong build.gradle (neu co)
        if os.path.exists('android/build.gradle'):
            with open('android/build.gradle', 'r', encoding='utf-8') as f:
                content = f.read()
            content = re.sub(r\"ext\.kotlin_version\s*=\s*['\\\"][^'\\\"]+['\\\"]\", \"ext.kotlin_version = '1.9.24'\", content)
            with open('android/build.gradle', 'w', encoding='utf-8') as f:
                f.write(content)
        "

    - name: Cai dat logo va Doi ten app thanh Google Meta
      run: |
        pip install Pillow --quiet
        python3 -c "
        import os, re
        from PIL import Image

        # 1. Doi ten App thanh Google Meta va giu icon @mipmap/ic_launcher chuan
        mpath = 'android/app/src/main/AndroidManifest.xml'
        with open(mpath, 'r', encoding='utf-8') as f:
            s = f.read()
        s = re.sub(r'android:label=\"[^\"]+\"', 'android:label=\"Google Meta\"', s)
        s = re.sub(r'android:icon=\"[^\"]+\"', 'android:icon=\"@mipmap/ic_launcher\"', s)
        perm = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
        if 'android.permission.INTERNET' not in s:
            s = s.replace('<application', perm + '    <application')
        if 'android:usesCleartextTraffic' not in s:
            s = s.replace('<application', '<application\n        android:usesCleartextTraffic=\"true\"')
        with open(mpath, 'w', encoding='utf-8') as f:
            f.write(s)

        # 2. Thay the truc tiep icon ic_launcher.png o moi do phan giai bang logo moi
        sizes = {
            'mipmap-mdpi': (48, 48),
            'mipmap-hdpi': (72, 72),
            'mipmap-xhdpi': (96, 96),
            'mipmap-xxhdpi': (144, 144),
            'mipmap-xxxhdpi': (192, 192),
        }
        if os.path.exists('assets/logo.png'):
            im = Image.open('assets/logo.png')
            for folder, size in sizes.items():
                d = os.path.join('android/app/src/main/res', folder)
                os.makedirs(d, exist_ok=True)
                im.resize(size, Image.Resampling.LANCZOS).save(os.path.join(d, 'ic_launcher.png'))
        "

    - name: Cai dat cac thu vien
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload file APK hoan chinh
      uses: actions/upload-artifact@v4
      with:
        name: googlemeta-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
