name: bocongthuong_app
description: "Ung dung Web-to-App Flutter chuyen nghiep"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

# Cau hinh tao icon ung dung tu dong
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

# Cau hinh man hinh cho (Splash Screen) chinh chu
flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash_logo.png"
  android_12:
    image: "assets/splash_logo.png"
    icon_background_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/
